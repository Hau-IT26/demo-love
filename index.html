<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tớ Tỏ Tình ❤️</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0d0d0d;
            color: #fff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .card {
            width: 100%;
            max-width: 380px;
            background: rgba(255, 255, 255, 0.07);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(255, 105, 180, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        h1 {
            color: #ff69b4;
            font-size: 1.5rem;
            margin-bottom: 15px;
            text-shadow: 0 0 10px #ff69b4;
        }
        .video-wrapper {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 15px;
        }
        video {
            width: 100%;
            display: block;
        }
        .lyric {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #ffe4e1;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>❤️ Cho Em Này ❤️</h1>
        <div class="video-wrapper">
            <video autoplay loop muted playsinline controls>
                <source src="video.mp4" type="video/mp4">
                Trình duyệt không hỗ trợ xem video.
            </video>
        </div>
        <p class="lyric">
            "Mọi dòng code hay màn hình máy tính đều có thể tắt,<br />
            nhưng hình bóng của em trong tâm trí anh thì chưa từng ngừng sáng."💕
        </p>
    </div>
</body>
</html>
